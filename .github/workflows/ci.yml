name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:  # a new push to a PR cancels its outdated run
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # the connector contract and cases (tests/test_contract.py, test_sql.py, test_mongo.py) run on real databases too
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      UNBLOCKD_TEST_PG: postgres://postgres:test@127.0.0.1:5432/postgres
      UNBLOCKD_TEST_MONGO: mongodb://127.0.0.1:27018/
      UNBLOCKD_TEST_MONGO_RS: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - name: MongoDB, standalone and a one-node replica set  # a service container can't take --replSet
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          docker run -d --name mongo-one -p 27018:27017 mongo:7
          for i in $(seq 1 60); do docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 1; done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-db.txt  # the same as the Docker image, so the MCP, Postgres and MongoDB tests run instead of skipping
      - run: python -m unittest -v

  py310:  # pyproject says requires-python >=3.10: a 3.12-only f-string once broke import there (CORE-89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q unblockd tests scripts

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1
      - run: npx playwright install chromium  # no --with-deps: the ubuntu runner already has Chrome's system libraries (apt took ~11 min)
      - run: node tests/ui_smoke.mjs

  image-db:
    # The image as built (no rebuild, no pip at run time) serves a board on Postgres and one on MongoDB, configured only by
    # UNBLOCKD_BOARDS (CORE-39). The shared suite itself runs on every connector in the test job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unblockd:ci .
      - name: What the database drivers add (their own layer)
        run: |
          docker history unblockd:ci --format '{{.Size}} {{.CreatedBy}}' | grep requirements
          docker image inspect unblockd:ci --format 'image size: {{.Size}} bytes'
      - name: A board on Postgres and one on MongoDB, same image
        run: |
          docker run -d --name ub --network host -e HOST=127.0.0.1 -e PORT=8799 -e TICKETS_DIR= \
            -e UNBLOCKD_BOARDS="postgres://postgres:test@127.0.0.1:5432/postgres#ci-pg:mongodb://127.0.0.1:27017/unblockd#ci-mongo" unblockd:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/healthz && break; sleep 1; done
          for b in ci-pg ci-mongo; do
            curl -sf -X POST -H 'Content-Type: application/json' -d '{"prefix": "CI", "title": "from the image"}' http://127.0.0.1:8799/api/b/$b/tickets
            curl -sf http://127.0.0.1:8799/api/b/$b/tickets | grep -q 'from the image'
          done
      - if: failure()
        run: docker logs ub

  image:
    # publishes ghcr.io/<owner>/unblockd on pushes to main (tag: latest) and on v* tags
    needs: [test, py310, ui, image-db]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: a v* tag must equal unblockd.__version__ (CORE-84)  # no image for a tag the code doesn't say
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check_version.py "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unblockd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
