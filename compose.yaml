# docker compose up -d   ->  board http://localhost:8787, MCP http://localhost:8788/mcp
# PROJECTS_DIR = a folder of projects (set it in .env next to this file). Every <project>/tickets/
# with an unblockd.json in it becomes a board; a tickets/ folder right at the top counts too.
x-unblockd: &unblockd   # shared by both services
  # image + build: `up` pulls the image (no build for you); when the pull finds none (not published yet) it builds from this folder.
  # Contributors: `docker compose up --build` always builds.
  image: ghcr.io/omri2003/unblockd:latest
  build: .
  # The image runs as uid 1001 (OpenShift-style), which can't write your bind-mounted projects on Linux
  # (host-owned files). Root here keeps the board and CLI writes working; deploy the image without this line.
  user: "0"
  volumes:
    - ${PROJECTS_DIR:-./example}:/projects
    # code mounted from this folder: UI edits show on browser reload,
    # Python edits on `docker compose restart`. Rebuild only for requirements.txt.
    - ./static:/app/static:ro
    - ./unblockd:/app/unblockd:ro
  environment: &env
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # enables the chat; put it in .env
    UNBLOCKD_TOKEN: ${UNBLOCKD_TOKEN:-}   # optional shared token for the API and MCP (see README)
    # The containers bind 0.0.0.0 inside, which the server refuses without a token. That is safe here only because the ports
    # below are published on 127.0.0.1. Publishing wider (or `docker run -p 8787:8787` without a token) should fail: set
    # UNBLOCKD_TOKEN then, don't copy this line.
    UNBLOCKD_ALLOW_OPEN: "1"
    UNBLOCKD_MODEL: ${UNBLOCKD_MODEL:-claude-sonnet-5-5}
    UNBLOCKD_WEBHOOK: ${UNBLOCKD_WEBHOOK:-}   # optional push notifications (see README)
    UNBLOCKD_WEBHOOK_FORMAT: ${UNBLOCKD_WEBHOOK_FORMAT:-json}
    UNBLOCKD_PUBLIC_URL: ${UNBLOCKD_PUBLIC_URL:-}
  restart: unless-stopped

services:
  unblockd:
    <<: *unblockd
    ports:
      - "127.0.0.1:8787:8787"   # this machine only unless UNBLOCKD_TOKEN is set
  unblockd-mcp:   # one MCP server for every project's Claude Code session
    <<: *unblockd
    command: python -m unblockd.mcp_server --http
    healthcheck: {disable: true}   # the image's check probes the board's /healthz
    environment:
      <<: *env
      HOST: 0.0.0.0   # inside the container; the port below is published on this machine only
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}   # extra Host values, e.g. mypc:* (default: localhost / 127.0.0.1 any port)
    ports:
      - "127.0.0.1:8788:8788"
